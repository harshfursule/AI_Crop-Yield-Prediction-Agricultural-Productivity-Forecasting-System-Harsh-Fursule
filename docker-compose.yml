version: "3.8"

services:
  # ==========================================
  # FastAPI Backend & ML Inference Engine
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yieldsense-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017/yieldsense_ai
      - SECRET_KEY=yieldsense_production_super_secret_jwt_key_2026
      - ALGORITHM=HS256
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - yieldsense-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # React + Vite Frontend (Nginx Alpine)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yieldsense-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - yieldsense-network

  # ==========================================
  # MongoDB Database Service
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: yieldsense-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - yieldsense-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  yieldsense-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
